<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习路线 - 云枢智学</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    /* ========== 学科选择网格：一排 5 个，9 个学科正好两排 ========== */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .subject-card {
      background: white;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      position: relative;
    }

    .subject-card:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    .subject-card.active {
      border-color: var(--primary-color);
      background: rgba(64, 158, 255, 0.04);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.15);
    }

    /* 无启用路线的学科：卡片弱化，仍可点击查看空态提示 */
    .subject-card.no-route {
      opacity: 0.68;
      background: var(--bg-color);
    }

    .subject-card .subject-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
    }

    .subject-card .subject-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    /* 学科卡片副信息：仅展示路线数量（进度在路线详情区展示） */
    .subject-card .subject-route-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========== 进度条（路线头部） ========== */
    .progress-bar {
      height: 8px;
      background: #eef1f5;
      border-radius: var(--radius-round);
      overflow: hidden;
    }

    .progress-bar .progress-bar-inner {
      height: 100%;
      background: linear-gradient(135deg, var(--primary-color), #79bbff);
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    /* ========== 路线切换（一个学科可有多条路线） ========== */
    .route-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .route-tabs-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .route-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-regular);
      background: white;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-round);
      cursor: pointer;
      transition: var(--transition);
    }

    .route-tab:hover {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .route-tab.active {
      color: white;
      background: var(--primary-color);
      border-color: var(--primary-color);
    }

    .route-tab .route-tab-progress {
      padding: 1px 8px;
      font-size: 11px;
      border-radius: var(--radius-round);
      background: rgba(64, 158, 255, 0.12);
      color: var(--primary-color);
    }

    .route-tab.active .route-tab-progress {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    /* ========== 路线详情容器 ========== */
    .route-detail-area {
      display: none;
    }

    .route-detail-area.visible {
      display: block;
      animation: fadeInUp 0.4s ease forwards;
    }

    /* ========== 路线头部 ========== */
    .route-header-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 28px 32px;
      margin-bottom: 28px;
    }

    .route-header-card .route-title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .route-header-card .route-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .route-header-card .route-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
      background: rgba(64, 158, 255, 0.1);
      color: var(--primary-color);
      border-radius: var(--radius-round);
      white-space: nowrap;
    }

    .route-header-card .route-desc {
      font-size: 14px;
      color: var(--text-regular);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .route-header-card .route-stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .route-header-card .route-stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .route-header-card .route-stat-item .stat-val {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* 路线进度行 */
    .route-progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }

    .route-progress-row .progress-bar {
      flex: 1;
      max-width: 420px;
    }

    .route-progress-row .route-progress-text {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .route-progress-row .route-progress-text .stat-val {
      font-weight: 600;
      color: var(--primary-color);
    }

    /* ========== 路线课程区 ========== */
    .route-courses-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .route-courses-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px 24px;
      transition: var(--transition);
    }

    .route-courses-card:hover {
      box-shadow: var(--shadow-md);
    }

    .route-courses-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .route-courses-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .route-courses-tip {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========== 课程列表 ========== */
    .courses-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .course-order {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(64, 158, 255, 0.1);
      color: var(--primary-color);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .course-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-color);
      border-radius: var(--radius-md);
      transition: var(--transition);
    }

    .course-item:hover {
      background: rgba(64, 158, 255, 0.05);
    }

    /* 已学完的课程 */
    .course-item.completed {
      background: rgba(103, 194, 58, 0.07);
    }

    .course-item.completed .course-order {
      background: rgba(103, 194, 58, 0.15);
      color: #67c23a;
    }

    .course-thumb {
      width: 120px;
      height: 68px;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background-color: #e8ecf1;
    }

    .course-thumb .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #c0c4cc;
    }

    .course-info {
      flex: 1;
      min-width: 0;
    }

    .course-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .course-item.completed .course-title {
      color: var(--text-secondary);
    }

    .course-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }

    .course-meta .bvid-badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(230, 162, 60, 0.1);
      color: #e6a23c;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }

    .course-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-bilibili {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      background: linear-gradient(135deg, #fb7299, #f5728b);
      color: white;
      border: none;
      border-radius: var(--radius-round);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    .btn-bilibili:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(251, 114, 153, 0.4);
    }

    /* 标记已学完 */
    .btn-complete {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      background: white;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: var(--radius-round);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-complete:hover {
      background: rgba(64, 158, 255, 0.08);
    }

    .btn-complete.done {
      background: #f4f6f9;
      color: #67c23a;
      border-color: #d9e6c8;
      cursor: default;
    }

    .courses-empty {
      padding: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--bg-color);
      border-radius: var(--radius-md);
      margin-top: 12px;
    }

    /* ========== 空状态提示 ========== */
    .route-empty-hint {
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    /* ========== 动画 ========== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in-up {
      animation: fadeInUp 0.4s ease forwards;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 1200px) {
      .subject-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 1024px) {
      .subject-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .subject-card {
        padding: 16px 12px;
      }

      .subject-card .subject-icon {
        font-size: 28px;
      }

      .route-header-card {
        padding: 20px;
      }

      .route-header-card .route-stats {
        gap: 12px;
      }

      .route-progress-row {
        flex-wrap: wrap;
      }

      .route-courses-card {
        padding: 16px;
      }

      .course-order {
        width: 22px;
        height: 22px;
      }

      .course-item {
        flex-wrap: wrap;
      }

      .course-thumb {
        width: 80px;
        height: 46px;
      }

      .course-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }

    @media (max-width: 480px) {
      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>

    <!-- 内容区域 -->
    <div class="container" style="padding: 40px 20px;">

      <!-- 学科选择标题 -->
      <h2 style="font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">选择学科方向</h2>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; margin-top: -10px;">选择一个学科，查看该学科的学习路线与学习进度</p>

      <!-- 学科网格 -->
      <div class="subject-grid" id="subjectGrid"></div>

      <!-- 路线详情区域（初始隐藏） -->
      <div class="route-detail-area" id="routeDetailArea">
        <!-- 路线切换（学科有多条路线时展示） -->
        <div class="route-tabs" id="routeTabs"></div>
        <!-- 路线头部 -->
        <div class="route-header-card" id="routeHeaderCard"></div>
        <!-- 路线课程列表（按学习顺序） -->
        <div class="route-courses-list" id="routeCourseList"></div>
      </div>

      <!-- 初始空状态 -->
      <div class="route-empty-hint" id="emptyHint">
        👆 请选择一个学科方向，查看对应的系统化学习路线
      </div>

  <script src="../js/common.js"></script>
  <script>
    (function() {
      'use strict';

      var currentSubjectId = null;
      var currentRouteId = null;

      // ============================
      // 计算路线汇总数据（课程列表 + 总时长 + 进度）
      // ============================
      function computeRouteSummary(route) {
        if (!route) return { totalCourses: 0, totalDurationMin: 0, courses: [], progress: { total: 0, completed: 0, percent: 0 } };
        var courses = getCoursesByIds(route.courseIds || []);
        var totalDurationMin = 0;
        courses.forEach(function(c) {
          totalDurationMin += c.durationMin || 0;
        });
        return {
          totalCourses: courses.length,
          totalDurationMin: totalDurationMin,
          courses: courses,
          progress: getRouteProgress(route)
        };
      }

      // ============================
      // 格式化分钟为小时+分钟
      // ============================
      function formatMinutes(minutes) {
        if (!minutes) return '0 分钟';
        var h = Math.floor(minutes / 60);
        var m = Math.round(minutes % 60);
        if (h > 0 && m > 0) return h + ' 小时 ' + m + ' 分钟';
        if (h > 0) return h + ' 小时';
        return m + ' 分钟';
      }

      // ============================
      // 渲染学科网格（一排 5 个）
      // 卡片：图标 + 学科名 + 路线数量（进度在下方路线详情区展示）
      // 无启用路线的学科卡片弱化展示，点击后给出空态提示
      // ============================
      function renderSubjectGrid() {
        var grid = document.getElementById('subjectGrid');
        grid.innerHTML = '';

        MockData.subjects.slice().sort(function(a, b) { return (a.sort || 0) - (b.sort || 0); }).forEach(function(subject) {
          var routes = getRoutesBySubjectId(subject.id);

          var card = document.createElement('div');
          card.className = 'subject-card fade-in-up' + (routes.length === 0 ? ' no-route' : '');
          card.setAttribute('data-subject-id', subject.id);

          card.innerHTML =
            '<span class="subject-icon">' + subject.icon + '</span>' +
            '<div class="subject-name">' + subject.name + '</div>' +
            '<div class="subject-route-count">' + (routes.length > 0 ? routes.length + ' 条路线' : '暂未开放') + '</div>';

          card.addEventListener('click', function() {
            selectSubject(subject.id);
          });

          grid.appendChild(card);
        });
      }

      // ============================
      // 选中学科：默认选中「最近学习优先」的第一条路线
      // ============================
      function selectSubject(subjectId, keepRouteId) {
        currentSubjectId = subjectId;

        document.querySelectorAll('.subject-card').forEach(function(c) {
          c.classList.toggle('active', c.getAttribute('data-subject-id') === subjectId);
        });

        var emptyHint = document.getElementById('emptyHint');
        var area = document.getElementById('routeDetailArea');
        var routes = getRoutesBySubjectId(subjectId);

        if (routes.length === 0) {
          currentRouteId = null;
          area.classList.remove('visible');
          emptyHint.style.display = 'block';
          emptyHint.textContent = '😅 该学科暂无学习路线，敬请期待';
          return;
        }

        emptyHint.style.display = 'none';

        // 切换学科时回到默认路线；同一学科内切换路线时保留当前选择
        var target = routes.filter(function(r) { return r.id === keepRouteId; })[0] || routes[0];
        currentRouteId = target.id;

        renderRouteTabs(routes, currentRouteId);
        renderRouteDetail(target);

        area.classList.add('visible');
        if (!keepRouteId) {
          setTimeout(function() {
            area.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 50);
        }
      }

      // ============================
      // 渲染路线切换标签
      // ============================
      function renderRouteTabs(routes, activeRouteId) {
        var tabs = document.getElementById('routeTabs');

        if (routes.length <= 1) {
          tabs.innerHTML = '';
          tabs.style.display = 'none';
          return;
        }

        tabs.style.display = 'flex';
        tabs.innerHTML = '<span class="route-tabs-label">本学科共 ' + routes.length + ' 条路线：</span>';

        routes.forEach(function(route) {
          var progress = getRouteProgress(route);
          var tab = document.createElement('div');
          tab.className = 'route-tab' + (route.id === activeRouteId ? ' active' : '');
          tab.innerHTML =
            '<span>' + route.name + '</span>' +
            '<span class="route-tab-progress">' + progress.completed + '/' + progress.total + '</span>';
          tab.addEventListener('click', function() {
            selectSubject(currentSubjectId, route.id);
          });
          tabs.appendChild(tab);
        });
      }

      // ============================
      // 渲染路线详情
      // ============================
      function renderRouteDetail(route) {
        renderRouteHeader(route);
        renderCourseList(route);
      }

      // ============================
      // 渲染路线头部（含进度）
      // ============================
      function renderRouteHeader(route) {
        var header = document.getElementById('routeHeaderCard');
        var summary = computeRouteSummary(route);
        var progress = summary.progress;
        var subject = getSubjectById(route.subjectId);

        header.innerHTML =
          '<div class="route-title-row">' +
            (subject ? '<span style="font-size:28px;">' + subject.icon + '</span>' : '') +
            '<span class="route-name">' + route.name + '</span>' +
            '<span class="route-badge">' + route.suitableFor.replace('🎓 ', '') + '</span>' +
          '</div>' +
          '<div class="route-desc">' + route.description + '</div>' +
          '<div class="route-stats">' +
            '<span class="route-stat-item">📚 共 <span class="stat-val">' + summary.totalCourses + '</span> 门课程</span>' +
            '<span class="route-stat-item">⏱ 总计 <span class="stat-val">' + formatMinutes(summary.totalDurationMin) + '</span></span>' +
            '<span class="route-stat-item">🎯 <span class="stat-val">按列表顺序学习</span></span>' +
          '</div>' +
          '<div class="route-progress-row">' +
            '<div class="progress-bar"><div class="progress-bar-inner" style="width: ' + progress.percent + '%;"></div></div>' +
            '<span class="route-progress-text">已完成 <span class="stat-val">' + progress.completed + '/' + progress.total + '</span> 门 · ' + progress.percent + '%</span>' +
          '</div>';
      }

      // ============================
      // 渲染路线课程列表（列表顺序即学习顺序）
      // 学完一门课后可「标记已学完」，标记后进度实时更新（仅可标记，不可取消）
      // ============================
      function renderCourseList(route) {
        var container = document.getElementById('routeCourseList');
        container.innerHTML = '';

        var summary = computeRouteSummary(route);
        var courses = summary.courses || [];
        var completedIds = route.completedCourseIds || [];

        var coursesHtml = '';
        if (courses.length > 0) {
          coursesHtml = '<div class="courses-list">';
          courses.forEach(function(course, idx) {
            var thumbStyle = '';
            if (course.pic) {
              thumbStyle = 'background-image: url(' + course.pic + ');';
            }
            var isCompleted = completedIds.indexOf(course.id) >= 0;
            var formattedDur = formatDuration(course.duration);
            coursesHtml +=
              '<div class="course-item' + (isCompleted ? ' completed' : '') + '">' +
                '<div class="course-order">' + (idx + 1) + '</div>' +
                '<div class="course-thumb" style="' + thumbStyle + '">' +
                  (course.pic ? '' : '<div class="thumb-placeholder">🎬</div>') +
                '</div>' +
                '<div class="course-info">' +
                  '<div class="course-title">' + course.title + '</div>' +
                  '<div class="course-meta">' +
                    '<span class="bvid-badge">' + course.bvid + '</span>' +
                    '<span>⏱ ' + formattedDur + '</span>' +
                  '</div>' +
                '</div>' +
                '<div class="course-actions">' +
                  '<a class="btn-bilibili" href="https://www.bilibili.com/video/' + course.bvid + '" target="_blank" rel="noopener noreferrer">▶ 去B站学习</a>' +
                  (isCompleted
                    ? '<button class="btn-complete done" type="button" disabled>✓ 已学完</button>'
                    : '<button class="btn-complete" type="button" data-course-id="' + course.id + '">标记已学完</button>') +
                '</div>' +
              '</div>';
          });
          coursesHtml += '</div>';
        } else {
          coursesHtml = '<div class="courses-empty">📺 课程筹备中，敬请期待</div>';
        }

        var card = document.createElement('div');
        card.className = 'route-courses-card fade-in-up';
        card.innerHTML =
          '<div class="route-courses-header">' +
            '<div class="route-courses-title">📚 路线课程</div>' +
            '<div class="route-courses-tip">共 ' + courses.length + ' 门课程，按顺序学习效果更佳</div>' +
          '</div>' +
          coursesHtml;

        container.appendChild(card);

        container.querySelectorAll('.btn-complete[data-course-id]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            markCourseCompleted(route, btn.getAttribute('data-course-id'));
          });
        });
      }

      // ============================
      // 标记课程已学完（模拟 P-R03：写入后重算进度并刷新页面）
      // ============================
      function markCourseCompleted(route, courseId) {
        if (!route.completedCourseIds) route.completedCourseIds = [];
        if (route.completedCourseIds.indexOf(courseId) >= 0) return;

        route.completedCourseIds.push(courseId);
        showToast('已标记为学完，进度已更新', 'success');

        var routes = getRoutesBySubjectId(currentSubjectId);
        renderRouteTabs(routes, route.id);
        renderRouteDetail(route);
        renderSubjectGrid();
        document.querySelectorAll('.subject-card').forEach(function(c) {
          c.classList.toggle('active', c.getAttribute('data-subject-id') === currentSubjectId);
        });
      }

      // ============================
      // 初始化
      // ============================
      renderSubjectGrid();

    })();
  </script>
</body>
</html>
