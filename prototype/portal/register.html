<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 云枢智学</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .register-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* 左侧品牌区域 */
    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
    }

    .brand-logo {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .brand-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .brand-subtitle {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .register-steps {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 300px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0.7;
    }

    .step-item.active {
      opacity: 1;
    }

    .step-number {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
    }

    .step-item.active .step-number {
      background: white;
      color: #667eea;
    }

    .step-text h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .step-text p {
      font-size: 13px;
      opacity: 0.8;
    }

    /* 右侧注册表单 */
    .register-section {
      width: 520px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .register-box {
      width: 100%;
      max-width: 400px;
    }

    .register-header {
      margin-bottom: 32px;
    }

    .register-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .register-subtitle {
      color: var(--text-secondary);
    }

    /* 表单样式 */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-regular);
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-placeholder);
    }

    .form-input {
      padding-left: 44px;
    }

    .phone-input {
      display: flex;
      gap: 10px;
    }

    .phone-input .form-input {
      flex: 1;
    }

    .sms-btn {
      white-space: nowrap;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 14px;
      color: var(--primary-color);
      cursor: pointer;
      transition: var(--transition);
    }

    .sms-btn:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border-light);
      border-radius: 2px;
      transition: var(--transition);
    }

    .strength-bar.active {
      background: var(--danger-color);
    }

    .strength-bar.medium {
      background: var(--warning-color);
    }

    .strength-bar.strong {
      background: var(--success-color);
    }

    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .agreement input {
      margin-top: 3px;
    }

    .agreement a {
      color: var(--primary-color);
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .login-link {
      text-align: center;
      color: var(--text-secondary);
    }

    .login-link a {
      color: var(--primary-color);
      font-weight: 500;
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .brand-section {
        display: none;
      }

      .register-section {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <!-- 左侧品牌 -->
    <div class="brand-section">
      <div class="brand-logo"><span class="brand-mark" aria-hidden="true"></span></div>
      <h1 class="brand-title">云枢智学</h1>
      <p class="brand-subtitle">加入我们，开启面试训练之旅</p>

      <div class="register-steps">
        <div class="step-item active">
          <div class="step-number">1</div>
          <div class="step-text">
            <h4>创建账号</h4>
            <p>填写手机号，设置密码</p>
          </div>
        </div>
        <div class="step-item">
          <div class="step-number">2</div>
          <div class="step-text">
            <h4>完善信息</h4>
            <p>选择技术方向，定制学习计划</p>
          </div>
        </div>
        <div class="step-item">
          <div class="step-number">3</div>
          <div class="step-text">
            <h4>开始训练</h4>
            <p>刷题练习，AI模拟面试</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧注册 -->
    <div class="register-section">
      <div class="register-box">
        <div class="register-header">
          <h2 class="register-title">创建新账号</h2>
          <p class="register-subtitle">注册即可获得AI面试训练资格</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label>手机号</label>
            <div class="input-wrapper">
              <span class="input-icon">📱</span>
              <input type="tel" class="form-input" placeholder="请输入手机号">
            </div>
          </div>

          <div class="form-group">
            <label>验证码</label>
            <div class="phone-input">
              <div class="input-wrapper" style="flex:1">
                <span class="input-icon">🔐</span>
                <input type="text" class="form-input" placeholder="请输入验证码">
              </div>
              <button type="button" class="sms-btn">获取验证码</button>
            </div>
          </div>

          <div class="form-group">
            <label>设置密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请设置密码（6-20位）" id="password">
            </div>
            <div class="password-strength">
              <div class="strength-bar" id="str1"></div>
              <div class="strength-bar" id="str2"></div>
              <div class="strength-bar" id="str3"></div>
            </div>
          </div>

          <div class="form-group">
            <label>确认密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请再次输入密码">
            </div>
          </div>

          <label class="agreement">
            <input type="checkbox" id="agreeCheckbox">
            <span>我已阅读并同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a></span>
          </label>

          <button type="submit" class="btn btn-primary register-btn">立即注册</button>
        </form>

        <p class="login-link">
          已有账号？<a href="login.html">立即登录</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script>
    // 密码强度检测
    document.getElementById('password').addEventListener('input', function() {
      const password = this.value;
      const str1 = document.getElementById('str1');
      const str2 = document.getElementById('str2');
      const str3 = document.getElementById('str3');

      // 重置
      [str1, str2, str3].forEach(bar => {
        bar.className = 'strength-bar';
      });

      if (password.length === 0) return;

      let strength = 0;
      if (password.length >= 6) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password) && /[^a-zA-Z0-9]/.test(password)) strength++;

      if (strength === 1) {
        str1.className = 'strength-bar active';
      } else if (strength === 2) {
        str1.className = 'strength-bar medium';
        str2.className = 'strength-bar medium';
      } else {
        str1.className = 'strength-bar strong';
        str2.className = 'strength-bar strong';
        str3.className = 'strength-bar strong';
      }
    });

    // 表单提交
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!document.getElementById('agreeCheckbox').checked) {
        showToast('请先同意用户协议', 'warning');
        return;
      }
      showToast('注册成功，正在跳转登录...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });

    // SMS按钮倒计时
    document.querySelector('.sms-btn').addEventListener('click', function() {
      let countdown = 60;
      this.disabled = true;
      this.textContent = `${countdown}s后重试`;

      const timer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          this.disabled = false;
          this.textContent = '获取验证码';
        } else {
          this.textContent = `${countdown}s后重试`;
        }
      }, 1000);
    });
  </script>
</body>
</html>
