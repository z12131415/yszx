<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - 云枢智学</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .reset-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
    }

    .brand-logo {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .brand-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .brand-subtitle {
      font-size: 18px;
      opacity: 0.9;
    }

    .reset-section {
      width: 480px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .reset-box {
      width: 100%;
      max-width: 360px;
    }

    .reset-header {
      margin-bottom: 40px;
    }

    .reset-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .reset-subtitle {
      color: var(--text-secondary);
    }

    /* 步骤指示器 */
    .steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 40px;
      position: relative;
    }

    .steps::before {
      content: '';
      position: absolute;
      top: 16px;
      left: 40px;
      right: 40px;
      height: 2px;
      background: var(--border-light);
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-color);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      transition: var(--transition);
    }

    .step.active .step-number {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }

    .step.completed .step-number {
      background: var(--success-color);
      border-color: var(--success-color);
      color: white;
    }

    .step-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .step.active .step-label {
      color: var(--primary-color);
      font-weight: 500;
    }

    /* 表单步骤 */
    .form-step {
      display: none;
    }

    .form-step.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-regular);
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-placeholder);
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: var(--transition);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
    }

    .phone-input {
      display: flex;
      gap: 10px;
    }

    .phone-input .form-input {
      flex: 1;
    }

    .sms-btn {
      white-space: nowrap;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 14px;
      color: var(--primary-color);
      cursor: pointer;
      transition: var(--transition);
    }

    .sms-btn:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .sms-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .back-link {
      text-align: center;
      color: var(--text-secondary);
    }

    .back-link a {
      color: var(--primary-color);
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: rgba(103, 194, 58, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }

    .success-text {
      text-align: center;
      margin-bottom: 32px;
    }

    .success-text h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .success-text p {
      color: var(--text-secondary);
    }

    @media (max-width: 900px) {
      .brand-section {
        display: none;
      }

      .reset-section {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="brand-section">
      <div class="brand-logo"><span class="brand-mark" aria-hidden="true"></span></div>
      <h1 class="brand-title">云枢智学</h1>
      <p class="brand-subtitle">AI赋能的智能面试训练平台</p>
    </div>

    <div class="reset-section">
      <div class="reset-box">
        <div class="reset-header">
          <h2 class="reset-title">找回密码</h2>
          <p class="reset-subtitle">通过手机号验证重置密码</p>
        </div>

        <!-- 步骤指示器 -->
        <div class="steps">
          <div class="step active" id="step1Indicator">
            <div class="step-number">1</div>
            <span class="step-label">验证手机</span>
          </div>
          <div class="step" id="step2Indicator">
            <div class="step-number">2</div>
            <span class="step-label">重置密码</span>
          </div>
          <div class="step" id="step3Indicator">
            <div class="step-number">3</div>
            <span class="step-label">完成</span>
          </div>
        </div>

        <!-- 步骤1：验证手机号 -->
        <form id="step1" class="form-step active">
          <div class="form-group">
            <label>手机号</label>
            <div class="input-wrapper">
              <span class="input-icon">📱</span>
              <input type="tel" class="form-input" placeholder="请输入注册时的手机号" id="resetPhone">
            </div>
          </div>

          <div class="form-group">
            <label>验证码</label>
            <div class="phone-input">
              <div class="input-wrapper" style="flex:1">
                <span class="input-icon">🔐</span>
                <input type="text" class="form-input" placeholder="请输入验证码" id="resetCode">
              </div>
              <button type="button" class="sms-btn" onclick="sendSMS()">获取验证码</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary submit-btn">下一步</button>

          <p class="back-link">
            <a href="login.html">← 返回登录</a>
          </p>
        </form>

        <!-- 步骤2：重置密码 -->
        <form id="step2" class="form-step">
          <div class="form-group">
            <label>新密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请设置新密码（6-20位）" id="newPassword">
            </div>
          </div>

          <div class="form-group">
            <label>确认密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" placeholder="请再次输入新密码" id="confirmPassword">
            </div>
          </div>

          <button type="submit" class="btn btn-primary submit-btn">重置密码</button>
        </form>

        <!-- 步骤3：完成 -->
        <div id="step3" class="form-step">
          <div class="success-icon">✓</div>
          <div class="success-text">
            <h3>密码重置成功</h3>
            <p>请使用新密码登录</p>
          </div>
          <button class="btn btn-primary submit-btn" onclick="location.href='login.html'">立即登录</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script>
    let currentStep = 1;

    // 发送验证码
    function sendSMS() {
      const phone = document.getElementById('resetPhone').value;
      if (!phone || phone.length !== 11) {
        showToast('请输入正确的手机号', 'warning');
        return;
      }

      const btn = document.querySelector('.sms-btn');
      let countdown = 60;
      btn.disabled = true;
      btn.textContent = `${countdown}s后重试`;

      const timer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = `${countdown}s后重试`;
        }
      }, 1000);

      showToast('验证码已发送', 'success');
    }

    // 步骤1提交
    document.getElementById('step1').addEventListener('submit', (e) => {
      e.preventDefault();
      const phone = document.getElementById('resetPhone').value;
      const code = document.getElementById('resetCode').value;

      if (!phone || phone.length !== 11) {
        showToast('请输入正确的手机号', 'warning');
        return;
      }

      if (!code || code.length !== 6) {
        showToast('请输入6位验证码', 'warning');
        return;
      }

      goToStep(2);
    });

    // 步骤2提交
    document.getElementById('step2').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (!password || password.length < 6) {
        showToast('密码长度不能少于6位', 'warning');
        return;
      }

      if (password !== confirm) {
        showToast('两次输入的密码不一致', 'warning');
        return;
      }

      goToStep(3);
      showToast('密码重置成功', 'success');
    });

    // 切换步骤
    function goToStep(step) {
      // 隐藏所有步骤
      document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));

      // 显示当前步骤
      document.getElementById(`step${step}`).classList.add('active');
      document.getElementById(`step${step}Indicator`).classList.add('active');

      // 标记已完成的步骤
      for (let i = 1; i < step; i++) {
        document.getElementById(`step${i}Indicator`).classList.add('completed');
      }

      currentStep = step;
    }
  </script>
</body>
</html>
