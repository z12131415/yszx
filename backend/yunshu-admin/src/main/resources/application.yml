server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: yunshu
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:yunshu_db}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_ROOT_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.yunshu.**.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT 配置
yunshu:
  jwt:
    student:
      secret: ${JWT_STUDENT_SECRET:yunshu-student-secret-key-for-jwt-signing-must-be-at-least-256-bits}
      expiration-ms: ${JWT_STUDENT_EXPIRATION_MS:1800000}  # 30分钟
    admin:
      secret: ${JWT_ADMIN_SECRET:yunshu-admin-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-enough}
      expiration-ms: ${JWT_ADMIN_EXPIRATION_MS:604800000}  # 7天

  # AI 服务配置（OpenAI 兼容接口）
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:your-api-key-here}
    model: ${AI_MODEL:claude-sonnet-4-20250514}
    timeout-seconds: 30

  # 文件存储
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    access-url-prefix: ${FILE_ACCESS_PREFIX:http://localhost:8080/uploads}
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin123}
      bucket: ${MINIO_BUCKET:yunshu}

  # 每日面试配额
  interview:
    daily-quota: ${INTERVIEW_DAILY_QUOTA:5}

# 日志配置
logging:
  level:
    com.yunshu: DEBUG
    org.springframework.security: WARN
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
