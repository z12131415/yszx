# ============================================================
# 云枢智学 — Docker Compose（开发环境）
# 一键启动：MySQL 8.0 + Redis 7.x
#
# 使用方式：
#   cd "D:\IDE\1.1Test\VibeCodingTest\云枢智学"
#   docker compose up -d
# ============================================================

name: yunshu-dev

services:
  # ----------------------------------------------------------
  # MySQL 8.0 主数据库
  # 自动初始化数据库 yunshu_db 并执行 scripts/sql/schema.sql
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-yunshu_db}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --default-time-zone=+08:00
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - yunshu-net

  # ----------------------------------------------------------
  # Redis 7.x — 缓存 / 会话 / 频控计数器
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123456}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yunshu-net

# ============================================================
# 数据卷持久化（容器删除后数据不丢失）
# ============================================================
volumes:
  mysql_data:
    name: yunshu_mysql_data
  redis_data:
    name: yunshu_redis_data

# ============================================================
# 自定义网络
# ============================================================
networks:
  yunshu-net:
    name: yunshu-net
    driver: bridge
